<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG em HTML</title>
</head>
<body>
    <h1>TAG em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual TAG deverá utilizar em cada caso.</p>
    <ul>
        <li><span title="Utilize a tag <p>.">Parágrafos</span></li>
        <li><span title="Utilize a tag <h1...h6>">Títulos</span></li>
        <li><span title="Utilize a tag <img>">Imagens</span></li>
        <li><span title="Utilize a tag <abbr>">Abreviações</span></li>
        <li><span title="Utilize a tag <code>">Códigos-fonte</span></li>
        <li><span title="Utilize a tag <ol> e <li>">Listas numeradas</span></li>
        <li><span title="Utilize a tag <ul> e <li>">Listas com demarcadores</span></li>
    </ul>
</body>
</html>
