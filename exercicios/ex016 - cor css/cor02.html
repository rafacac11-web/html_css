<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradeinte em CSS</title>
</head>
<body>
    <h1 style="color: aliceblue;">Testando Gradiente</h1>
    <!--* configuração globais da CSS-->
    <style>
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient(-45deg, #25A69B, #245EA6, #042e62);
            background-attachment: fixed;
        }
    </style>
    
</body>
</html>
