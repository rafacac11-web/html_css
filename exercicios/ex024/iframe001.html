<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 600px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!--Tamanho padrão do iframe é de 300x150px-->
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" width="600" height="400"> <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a></iframe>
        para aprender a programar.</p>

    <p>O repositório do Guanabara <iframe src="https://gustavoguanabara.github.io" frameborder="0" width="600" height="400"> <a href="https://gustavoguanabara.github.io" target="_blank"></a>Repositorio github</iframe> também é bem legal!</p>

</body>
</html>
