<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="midia/calcada.mp4" width="700" controls></video>

    <p>segunda opção de vídeo</p>
    <video src="midia/calcada-v2.mp4" width="700" controls></video>

    <p>terceira opção de vídeo</p>
    <video src="midia/calcada_v3.mp4" width="700" controls loop></video>

    <p>Opção para adicionar videos de varios formatos</p>
    <video width="560" poster="imagens/m.png" controls>
        <source src="midia/calcada.mp4" type="video/mp4">
        <source src="midia/calcada-v2.mp4" type="video/mp4">
        <source src="midia/calcada_v3.mp4" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>

    </video> 

    <h1>inserindo vídeos do YouTube</h1>

    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/Tk9TM7-eTmw"
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>    

    <h1>Inserir vídeos do vimeo</h1>

    <iframe src="https://player.vimeo.com/video/1226766256?
    badge=0&amp;a
    utopause=0&amp;
    player_id=0&amp;
    app_id=58479" 
    width="560" 
    height="315" 
    frameborder="0" 
    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Stiller&#039;s at Katz&#039;s"></iframe>
</body>
</html>
