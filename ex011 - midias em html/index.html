<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/m.png" type="image/png">
        <img src="imagens/g.png" alt="Imagem flexível">

    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="midia/midia1.mp3" controls autoplay"></audio>
    <!--Compatibilidade de áudio em HTML 5 - MP3 WAV OGG-->
    <audio preload="metadata" controls autoplay loop>
        <source src="midia/midia2.mp3" type="audio/mpeg">
        <source src="midia/midia2.wav" type="audio/wav">
        <source src="midia/midia2.ogg" type="audio/ogg">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/midia2.mp3">Clique aqui para baixar o arquivo em MP3.</a></p>
    </audio>
</body>
</html>
